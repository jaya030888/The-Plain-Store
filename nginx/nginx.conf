events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream application services running on the host machine
    upstream backend_api {
        server host.docker.internal:5000;
        keepalive 32;
    }

    upstream client_app {
        server host.docker.internal:5173;
        keepalive 32;
    }

    upstream admin_app {
        server host.docker.internal:5174;
        keepalive 32;
    }

    server {
        listen 8088;
        server_name localhost;

        # -----------------------------------------------------------
        # Internal Auth Verification Subrequests (auth_request module)
        # -----------------------------------------------------------
        location = /_auth/verify-token {
            internal;
            proxy_pass http://backend_api/api/auth/verify-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        location = /_auth/verify-admin {
            internal;
            proxy_pass http://backend_api/api/auth/verify-admin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # -----------------------------------------------------------
        # Protected Route: Admin API (/api/admin/*)
        # Guarded by Nginx: Requires valid Admin JWT credentials
        # -----------------------------------------------------------
        location /api/admin/ {
            auth_request /_auth/verify-admin;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://backend_api;
        }

        # -----------------------------------------------------------
        # Protected Route: Customer Orders (/api/orders/my-orders)
        # Guarded by Nginx: Requires valid User JWT token
        # -----------------------------------------------------------
        location = /api/orders/my-orders {
            auth_request /_auth/verify-token;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://backend_api;
        }

        # -----------------------------------------------------------
        # Public API Endpoints (/api/*)
        # Directly proxied to Node/Express backend
        # -----------------------------------------------------------
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://backend_api;
        }

        # -----------------------------------------------------------
        # Admin Web Portal (/admin/)
        # -----------------------------------------------------------
        location /admin/ {
            proxy_pass http://admin_app/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # -----------------------------------------------------------
        # Client Storefront (Root /)
        # -----------------------------------------------------------
        location / {
            proxy_pass http://client_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # -----------------------------------------------------------
        # Structured JSON responses when Nginx rejects unauthorized requests
        # -----------------------------------------------------------
        error_page 401 = @error401;
        location @error401 {
            default_type application/json;
            return 401 '{"status":401,"error":"Unauthorized","message":"Access denied: Missing or invalid authentication token enforced by Nginx server"}';
        }

        error_page 403 = @error403;
        location @error403 {
            default_type application/json;
            return 403 '{"status":403,"error":"Forbidden","message":"Access denied: Admin role authorization required enforced by Nginx server"}';
        }
    }
}
